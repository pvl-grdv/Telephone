name: Cleanup merged work branches

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete integrated work branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/work/*:refs/remotes/origin/work/*' --prune
          master_trees="$(git log --format='%T' HEAD)"

          while IFS= read -r remote_ref; do
            branch="${remote_ref#refs/remotes/origin/}"
            branch_sha="$(git rev-parse "$remote_ref")"
            branch_tree="$(git rev-parse "$remote_ref^{tree}")"

            integrated=false
            if git merge-base --is-ancestor "$branch_sha" HEAD; then
              integrated=true
            elif grep -Fxq "$branch_tree" <<< "$master_trees"; then
              # Our normal flow creates one clean master commit using the
              # validated work branch tree, so commit ancestry is intentionally
              # different while the resulting source tree is identical.
              integrated=true
            fi

            if [[ "$integrated" == true ]]; then
              echo "Deleting integrated branch: $branch"
              # Delete only if the remote tip is still exactly the commit we
              # inspected above. If new work was pushed after our fetch,
              # --force-with-lease rejects the deletion instead of racing it.
              if ! git push \
                --force-with-lease="refs/heads/$branch:$branch_sha" \
                origin ":refs/heads/$branch"; then
                echo "::warning::Skipped $branch because it changed after cleanup started"
              fi
            else
              echo "Keeping unmerged branch: $branch"
            fi
          done < <(git for-each-ref --format='%(refname)' 'refs/remotes/origin/work/*')
